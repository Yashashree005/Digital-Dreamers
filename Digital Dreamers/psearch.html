<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Property Search</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    form {
      max-width: 600px;
      margin: auto;
      background: #f2f2f2;
      padding: 20px;
      border-radius: 8px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <h2 style="text-align:center;">Real Estate Property Search</h2>

  <form id="property-search-form">
    <input type="text" name="location" placeholder="Enter location" required>

    <select name="property_type" required>
      <option value="">Select Property Type</option>
      <option value="apartment">Apartment</option>
      <option value="house">House</option>
      <option value="land">Land</option>
    </select>

    <select name="price_range">
      <option value="">Select Price Range</option>
      <option value="0-100000">$0 - $100,000</option>
      <option value="100001-200000">$100,001 - $200,000</option>
      <option value="200001-500000">$200,001 - $500,000</option>
      <option value="500001+">$500,001+</option>
    </select>

    <button type="submit"><a href="search.html">search</a></button>
  </form>

  <script>
    document.getElementById('property-search-form').addEventListener('submit', function(event) {
      event.preventDefault();
      const location = this.location.value;
      const propertyType = this.property_type.value;
      const priceRange = this.price_range.value;

      // Example action - Display search parameters in console
      console.log("Searching for:", { location, propertyType, priceRange });

      // You can implement further logic here such as:
      // - sending a fetch request to a server
      // - filtering property cards on the page
    });
  </script>

</body>
</html>
